version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medilens_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medilens
      MYSQL_USER: medilens_user
      MYSQL_PASSWORD: medilens_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: medilens_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=medilens-production-secret-key-replace-me
      - DATABASE_URL=mysql+pymysql://medilens_user:medilens_password@db:3306/medilens?charset=utf8mb4
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
